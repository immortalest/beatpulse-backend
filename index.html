<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeatPulse Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; width: 100vw; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    header { background: #000; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #1db954; border-bottom: 1px solid #282828; }
    .search-box { display: flex; padding: 12px; gap: 8px; background: #181818; }
    .search-box input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #282828; color: #fff; font-size: 14px; outline: none; }
    .search-box button { padding: 10px 18px; border-radius: 20px; border: none; background: #1db954; color: #fff; font-weight: bold; cursor: pointer; }
    .song-list { flex: 1; padding: 10px; overflow-y: auto; padding-bottom: 90px; }
    .song-card { display: flex; align-items: center; padding: 10px; background: #181818; margin-bottom: 8px; border-radius: 8px; cursor: pointer; gap: 12px; }
    .song-card img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .song-info { flex: 1; overflow: hidden; }
    .song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: #b3b3b3; margin-top: 4px; }
    .player { position: fixed; bottom: 0; left: 0; width: 100%; background: #282828; padding: 12px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
    audio { width: 100%; height: 36px; }
    .status-msg { text-align: center; color: #888; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>

  <header>🎵 BeatPulse Music</header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search song or artist...">
    <button onclick="searchSong()">Search</button>
  </div>

  <div class="song-list" id="songList">
    <div class="status-msg">Searching trending songs...</div>
  </div>

  <div class="player">
    <div id="nowPlaying" style="font-size: 13px; color: #1db954; text-align: center;">Select a song to play</div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    const songList = document.getElementById('songList');
    const audioPlayer = document.getElementById('audioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');

    async function searchSong() {
      const q = document.getElementById('searchInput').value || 'Arijit Singh';
      songList.innerHTML = '<div class="status-msg">Loading songs...</div>';
      try {
        const res = await fetch(`/api/search-online?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        if(!data || data.length === 0) {
          songList.innerHTML = '<div class="status-msg">No songs found. Try another search.</div>';
          return;
        }
        songList.innerHTML = '';
        data.forEach(song => {
          const card = document.createElement('div');
          card.className = 'song-card';
          card.innerHTML = `
            <img src="${song.cover}" alt="cover">
            <div class="song-info">
              <div class="song-title">${song.title}</div>
              <div class="song-artist">${song.artist}</div>
            </div>
          `;
          card.onclick = () => playSong(song.id, song.title);
          songList.appendChild(card);
        });
      } catch(err) {
        songList.innerHTML = '<div class="status-msg" style="color:#ff5555">Server waking up... Please wait 10 seconds and search again.</div>';
      }
    }

    async function playSong(videoId, title) {
      nowPlaying.innerText = "Connecting stream: " + title;
      try {
        const res = await fetch(`/stream/${videoId}`);
        const data = await res.json();
        if(data.stream_url) {
          audioPlayer.src = data.stream_url;
          nowPlaying.innerText = "Playing: " + title;
          audioPlayer.play();
        } else {
          nowPlaying.innerText = "Unable to stream this song.";
        }
      } catch(err) {
        nowPlaying.innerText = "Error playing song.";
      }
    }

    // Auto search on load
    searchSong();
  </script>
</body>
</html>
